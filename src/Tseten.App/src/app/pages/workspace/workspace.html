<div class="workspace">
  <mat-toolbar color="primary" class="workspace__toolbar">
    <span class="workspace__title">Tseten</span>

    <span class="workspace__spacer"></span>

    <nav class="workspace__nav">
      <a mat-button routerLink="/workspace/requirements">
        <mat-icon>list_alt</mat-icon>
        Requirements
      </a>
    </nav>

    <span class="workspace__spacer"></span>

    @if (currentUser$ | async; as user) {
      <button mat-button [matMenuTriggerFor]="userMenu" class="workspace__user-btn">
        <mat-icon>account_circle</mat-icon>
        <span>{{ user.username }}</span>
        <mat-icon>arrow_drop_down</mat-icon>
      </button>
      <mat-menu #userMenu="matMenu">
        <button mat-menu-item disabled>
          <mat-icon>person</mat-icon>
          <span>Profile</span>
        </button>
        <button mat-menu-item disabled>
          <mat-icon>settings</mat-icon>
          <span>Settings</span>
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      </mat-menu>
    }
  </mat-toolbar>

  <main class="workspace__main">
    <router-outlet></router-outlet>
  </main>
</div>
